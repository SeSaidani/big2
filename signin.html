<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#041d13" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <title>Big Two · Sign in</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panel signin">
      <h1>Big Two <span class="muted">4 jokers wild</span></h1>
      <p id="help" class="muted">Accounts are created by an admin. Enter the name and password you were given.</p>
      <form id="form" novalidate>
        <div class="field">
          <label for="name">Name</label><input type="text" id="name" autocomplete="username" maxlength="20" />
        </div>
        <div class="field">
          <label for="pw">Password</label
          ><input id="pw" type="password" autocomplete="current-password" maxlength="200" />
        </div>
        <div class="field" id="codeField" hidden>
          <label for="code">Code from the text message</label
          ><input
            id="code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="123456"
          />
        </div>
        <div class="field" id="phoneField" hidden>
          <label for="phone">Mobile number, with country code (only to create an account)</label
          ><input id="phone" type="tel" autocomplete="tel" maxlength="30" placeholder="+44 7700 900123" />
        </div>
        <p id="err" class="bad" role="alert"></p>
        <div class="row">
          <button type="submit" id="loginBtn" class="primary">Log in</button>
          <button type="button" id="codeBtn" hidden>Text me a code</button>
          <button type="button" id="registerBtn" hidden>Create account</button>
        </div>
      </form>
    </main>
    <script type="module" src="signin.js"></script>
  </body>
</html>
